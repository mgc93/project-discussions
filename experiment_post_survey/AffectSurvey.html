{{ block title }}{{ endblock }}

{{ block content }}

<div style="max-width: 900px; margin: 0 auto;">

<!-- Feeling thermometer -->
<div class="mb-5">
    <p class="fw-bold">How warmly do you feel toward someone who holds the view expressed by the other participant?</p>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 0.80em; color: #666; margin-bottom: 2px;">
        <span style="text-align: left;">Very cold or unfavourable</span>
        <span style="text-align: center;">No feeling either way</span>
        <span style="text-align: right;">Very warm or favourable</span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; font-weight: 600; color: #333; margin-bottom: 6px;">
        <span style="text-align: left;">0</span>
        <span style="text-align: center;">50</span>
        <span style="text-align: right;">100</span>
    </div>

    <input type="range"
           id="affect_warmth_slider"
           class="form-range"
           min="0" max="100" step="1"
           value="50"
           oninput="syncWarmth(this.value)">

    <p class="mt-2 text-center">
        Your rating: <strong id="affect-warmth-value">50</strong> / 100
    </p>

    <input type="hidden" name="affect_warmth" id="id_affect_warmth" value="50">
</div>

{{ next_button }}

</div>

<script>
document.getElementById('id_affect_warmth').value = 50;

function syncWarmth(val) {
    document.getElementById('affect-warmth-value').textContent = val;
    document.getElementById('id_affect_warmth').value          = val;
}
</script>

{{ endblock }}
