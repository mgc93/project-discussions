{{ block title }}{{ endblock }}

{{ block content }}

<div style="max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.8; color: #555;">
    <div style="margin: 25px 0;">
        <p style="font-weight: bold; color: #333;">What type of facilitator did you see in the conversation?</p>
        <div style="margin-left: 20px;">
            <label style="display: block; margin: 8px 0; cursor: pointer;">
                <input type="radio" name="manip_check_type" value="ai_facilitator" required> AI Facilitator
            </label>
            <label style="display: block; margin: 8px 0; cursor: pointer;">
                <input type="radio" name="manip_check_type" value="human_facilitator"> Human Facilitator
            </label>
            <label style="display: block; margin: 8px 0; cursor: pointer;">
                <input type="radio" name="manip_check_type" value="dont_remember"> I don't remember
            </label>
        </div>
    </div>

    <style>
    .single-likert { width: 100%; border-collapse: collapse; margin-top: 6px; table-layout: fixed; }
    .single-likert th, .single-likert td { text-align: center; padding: 6px 4px; vertical-align: middle; }
    .single-likert thead tr.label-row th { font-size: 0.80em; font-weight: normal; color: #666; padding-bottom: 2px; }
    .single-likert thead tr.num-row th { font-weight: 600; color: #333; border-bottom: 2px solid #dee2e6; padding-bottom: 8px; }
    .single-likert input[type=radio] { width: 18px; height: 18px; cursor: pointer; accent-color: #0d6efd; }
    </style>

    <div style="margin: 25px 0;">
        <p style="font-weight: bold; color: #333;">How confident are you about your answer above?</p>
        <table class="single-likert">
            <colgroup><col style="width:20%"><col style="width:20%"><col style="width:20%"><col style="width:20%"><col style="width:20%"></colgroup>
            <thead>
                <tr class="label-row">
                    <th>Not at all confident</th><th></th><th></th><th></th><th>Very confident</th>
                </tr>
                <tr class="num-row">
                    <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    {% for val in "12345" %}
                    <td><input type="radio" name="manip_check_confidence" value="{{ val }}" required></td>
                    {% endfor %}
                </tr>
            </tbody>
        </table>
    </div>

    <div style="text-align: center; margin-top: 30px;">
        {{ next_button }}
    </div>
</div>

{{ endblock }}
